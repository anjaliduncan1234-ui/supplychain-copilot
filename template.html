<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SupplyChain Copilot</title>
<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#172033;--mu:#586174;--bd:#d9dfe8;--ac:#1d4ed8;--acs:#e6edff;--cr:#b42318;--crs:#fde8e6;--hi:#b54708;--his:#fdf0dc;--ok:#067647;--oks:#e3f6ec;--bar:#5b8def;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--sf:#182133;--tx:#e8edf6;--mu:#9aa6bb;--bd:#2c3850;--ac:#7aa2ff;--acs:#1e2d52;--cr:#ff9b92;--crs:#4a1f1c;--hi:#ffc27a;--his:#40290d;--ok:#6ee0a6;--oks:#12382a;--bar:#6c9bff}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100%}nav{width:210px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:2px 8px 2px}nav small{display:block;margin:0 8px 14px;color:var(--mu);font-size:11px}
nav button{display:block;width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:6px;background:none;color:var(--tx);font:inherit;cursor:pointer}
nav button[aria-current=page]{background:var(--acs);color:var(--ac);font-weight:600}nav button:hover{background:var(--acs)}
main{flex:1;min-width:0;padding:18px 22px 40px}h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mu);margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:14px}
label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}select,input,button.b{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;min-width:0}
button.b{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 12px}.chip{background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px}.kpi b{display:block;font-size:22px;margin:2px 0}.kpi span{font-size:12px;color:var(--mu)}.kpi i{display:block;font-style:normal;font-size:11px;color:var(--mu);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}.card h3{margin:0;font-size:14px}.card p{margin:2px 0 8px;font-size:12px;color:var(--mu)}
.row{display:grid;grid-template-columns:130px 1fr 80px;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:3px 4px;color:var(--tx);font:inherit;cursor:pointer}
.row:hover,.row.on{background:var(--acs)}.row .t{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.row .t i{display:block;height:100%;background:var(--bar)}.row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:11px;color:var(--mu);text-transform:uppercase;background:var(--bg);position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--acs)}td.wrap{white-space:normal;min-width:190px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pb{display:inline-block;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600;border:1px solid currentColor}.Critical{color:var(--cr);background:var(--crs)}.High{color:var(--hi);background:var(--his)}.Medium{color:var(--mu)}.Low{color:var(--ok)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mu)}.empty{padding:36px;text-align:center;color:var(--mu)}
#dr{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:var(--sf);border-left:1px solid var(--bd);box-shadow:-8px 0 24px #0003;overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));z-index:20}
#dr dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:8px 0}#dr dt{color:var(--mu)}#dr dd{margin:0}#dr h4{margin:16px 0 6px}.why{border-left:3px solid var(--cr);padding:4px 10px;margin:6px 0;background:var(--bg)}.note{background:var(--his);color:var(--hi);padding:6px 10px;border-radius:6px;margin:6px 0}.sg{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--acs)}
.ok{color:var(--ok)}.bad{color:var(--cr)}code{background:var(--bg);padding:1px 4px;border-radius:3px}.meth li{margin:4px 0}
@media(max-width:820px){nav{width:64px}nav h1,nav small{display:none}nav button{font-size:11px;padding:8px 4px;text-align:center}main{padding:14px}}
</style></head><body><div id="app"><nav aria-label="Main"></nav><main id="main" tabindex="-1"></main></div><div id="dr" hidden role="dialog" aria-label="Order details"></div>
<script id="csv" type="text/plain">/*CSV*/</script>
<script>/*ENGINE*/</script>
<script>
const E=Engine,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const inrC=n=>n>=1e7?'₹'+(n/1e7).toLocaleString('en-IN',{maximumFractionDigits:2})+' Cr':n>=1e5?'₹'+(n/1e5).toLocaleString('en-IN',{maximumFractionDigits:2})+' L':inr(n);
const pc=n=>n==null?'n/a':n.toFixed(1)+'%';const N=n=>n.toLocaleString('en-IN');
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let rows,ev;try{rows=E.load($('#csv').textContent)}catch(x){rows=[]}
const EF={q:'',supplier:'',site:'',category:'',status:'',priority:'',doc:'',pay:'',flag:''};
const S={view:'overview',asOf:today,f:{...EF},sort:'risk',dir:-1,page:0,sel:null,ent:{supplier:null,site:null}};
const uniq=k=>[...new Set(rows.map(r=>r[k]))].sort();
const F={supplier:['Supplier','supplier_name'],site:['Project site','project_site'],category:['Material category','material_category'],status:['Order status','order_status'],priority:['Priority','priority'],doc:['Document status','document_status'],pay:['Payment status','payment_status']};
const FLAGS={overdue:'Overdue open order',doc:'Documentation exception',pay:'Payment on hold',any:'Any exception'};
function recompute(){ev=rows.map(o=>({o,e:E.evaluate(o,S.asOf)}))}
function filt(){const f=S.f,q=f.q.toLowerCase();return ev.filter(({o,e})=>{
 for(const k in F)if(f[k]&&o[F[k][1]]!==f[k])return false;
 if(f.flag&&!(f.flag==='any'?e.count>0:e[f.flag]))return false;
 return !q||[o.order_id,o.supplier_name,o.material_name,o.project_site].some(v=>v.toLowerCase().includes(q))})}
const pb=p=>`<span class="pb ${esc(p)}">${{Critical:'▲▲ ',High:'▲ ',Medium:'● ',Low:'○ '}[p]||''}${esc(p)}</span>`;
function bars(title,note,items,field,activeVal,fmt){const mx=Math.max(1,...items.map(i=>i.v));
 return `<div class="card"><h3>${title}</h3><p>${note}</p>${items.length?items.map(i=>`<button class="row ${activeVal===i.k?'on':''}" data-set='${esc(JSON.stringify(i.set))}' title="${esc(i.k)}: ${esc(i.tip)}"><span>${esc(i.k)}</span><div class="t"><i style="width:${i.v/mx*100}%"></i></div><em>${fmt?fmt(i.v):N(i.v)}</em></button>`).join(''):'<div class="empty">No data for current filters</div>'}</div>`}
const tally=(list,fn)=>{const m={};list.forEach(x=>{const k=fn(x);if(k!=null)m[k]=(m[k]||0)+(x.v??1)});return m};
const items=(m,mk,tip,top)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,top||99).map(([k,v])=>({k,v,set:mk(k),tip:tip(v)}));
function filterBar(){return `<div class="bar" role="search">
<label>Search<input id="q" type="search" placeholder="Order ID, supplier, material, site" value="${esc(S.f.q)}" style="width:230px"></label>
${Object.entries(F).map(([k,[l,c]])=>`<label>${l}<select data-f="${k}"><option value="">All</option>${uniq(c).map(v=>`<option ${S.f[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`).join('')}
<button class="b" id="reset">Reset filters</button></div>${chips()}`}
function chips(){const c=Object.entries(S.f).filter(([k,v])=>v&&k!=='q').map(([k,v])=>`<span class="chip">${k==='flag'?FLAGS[v]:F[k][0]+': '+esc(v)}</span>`);return c.length?`<div class="chips" aria-live="polite">${c.join('')}</div>`:''}
function overview(){const L=filt(),k=E.kpis(L),open=L.filter(x=>x.e.open);
 const kp=(l,v,n)=>`<div class="card kpi"><span>${l}</span><b>${v}</b><i>${n}</i></div>`;
 return `<h2>Operations Overview</h2><p class="sub">${N(L.length)} of ${N(ev.length)} orders match the current filters. Simulated data, as-of date <b>${S.asOf}</b>.</p>${filterBar()}
<div class="kpis">${kp('Total orders',N(k.total),'Count of orders')}${kp('Total order value',inrC(k.value),inr(k.value)+' (all statuses)')}${kp('Open orders',N(k.open),'Status In Transit or Processing')}${kp('Overdue open orders',N(k.overdue),'Open and promised date before as-of date')}${kp('Documentation exceptions',N(k.docExc),'Document status not Complete (non-cancelled)')}${kp('Payment on hold',N(k.payHold),'Payment status On Hold (non-cancelled)')}${kp('High/critical priority',N(k.highCrit),'Source priority, non-cancelled')}</div>
<div class="kpis">${kp('Overdue-order rate',pc(k.overdueRate),`${N(k.overdue)} overdue ÷ ${N(k.open)} open`)}${kp('Documentation exception rate',pc(k.docRate),`${N(k.docExc)} ÷ ${N(k.total)} total orders`)}${kp('High-risk order share',pc(k.highRisk),`${N(k.highCrit)} ÷ ${N(k.live)} non-cancelled`)}${kp('Open order value',inrC(k.openValue),inr(k.openValue)+' in open orders')}</div>
<div class="grid">
${bars('Orders by status','Count of orders. Click a bar to filter.',items(tally(L,x=>x.o.order_status),k=>({status:k}),v=>v+' orders'),'status',S.f.status)}
${bars('Exceptions by type','Count of orders per exception. One order can have several, so bars can sum to more than the order count.',[['overdue','Overdue open orders'],['doc','Documentation exceptions'],['pay','Payment on hold']].map(([f,l])=>({k:l,v:L.filter(x=>x.e[f]).length,set:{flag:f},tip:'orders with this exception'})).filter(i=>i.v),'flag',FLAGS[S.f.flag])}
${bars('Overdue open orders by supplier','Count of overdue open orders. Counts show where overdue orders sit in this dataset, not a judgement of supplier quality.',items(tally(L.filter(x=>x.e.overdue),x=>x.o.supplier_name),k=>({supplier:k,flag:'overdue'}),v=>v+' overdue open orders'),'supplier',S.f.supplier)}
${bars('Order value by material category','Sum of order value in INR (money, not order count).',items(valueCat(L),k=>({category:k}),v=>inr(v)),'category',S.f.category,inrC)}
${bars('Orders with exceptions by project site','Count of orders with at least one active exception.',items(tally(L.filter(x=>x.e.count),x=>x.o.project_site),k=>({site:k,flag:'any'}),v=>v+' orders with exceptions'),'site',S.f.site)}
${bars('Priority distribution','Count of orders by source-provided priority. This dataset has no "High" level.',items(tally(L,x=>x.o.priority),k=>({priority:k}),v=>v+' orders'),'priority',S.f.priority)}
</div>`}
function valueCat(L){const m={};L.forEach(x=>m[x.o.material_category]=(m[x.o.material_category]||0)+x.o.order_value_inr);return m}
const SORTS={risk:['Risk score',x=>x.o.risk_score],late:['Days late / overdue',x=>x.e.overdue?x.e.daysOverdue:(x.e.lateDays??-1)],value:['Order value',x=>x.o.order_value_inr],promised:['Promised delivery date',x=>x.o.promised_delivery_date]};
function orderTable(L,pg,id){const fn=SORTS[S.sort][1];const s=[...L].sort((a,b)=>{const x=fn(a),y=fn(b);return(x<y?-1:x>y?1:0)*S.dir});const P=25,n=Math.ceil(s.length/P)||1,p=Math.min(pg,n-1);
 if(!s.length)return '<div class="card empty">No orders match these filters. Try removing a filter or search term.</div>';
 return `<div class="tw"><table><thead><tr>${['Order ID','Supplier','Project site','Category','Material','Promised','Status','Days late','Document','Payment','Priority','Risk','Recommended action (suggestion)'].map((h,i)=>`<th class="${i==7||i==11?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${s.slice(p*P,p*P+P).map(({o,e})=>`<tr tabindex="0" data-o="${o.order_id}"><td><b>${o.order_id}</b></td><td>${esc(o.supplier_name)}</td><td>${esc(o.project_site)}</td><td>${esc(o.material_category)}</td><td>${esc(o.material_name)}</td><td>${o.promised_delivery_date}</td><td>${o.order_status}</td><td class="n">${e.overdue?e.daysOverdue+' overdue':e.lateDays!=null?(e.lateDays>0?e.lateDays+' late':'On time'):'–'}</td><td>${o.document_status==='Complete'?'Complete':'⚠ '+esc(o.document_status)}</td><td>${o.payment_status==='On Hold'?'⏸ On Hold':o.payment_status}</td><td>${pb(o.priority)}</td><td class="n">${o.risk_score}</td><td class="wrap">${esc(e.actions[0])}</td></tr>`).join('')}</tbody></table></div>
 <div class="pg"><span>${N(s.length)} orders · page ${p+1} of ${n}</span><button class="b" data-pg="${id}:${p-1}" ${p<1?'disabled':''}>Previous</button><button class="b" data-pg="${id}:${p+1}" ${p>=n-1?'disabled':''}>Next</button></div>`}
function exceptions(){const L=filt();return `<h2>Exception Management</h2><p class="sub">Click a row for details. “Days late” shows days past promise for open orders, or actual − promised for delivered orders.</p>${filterBar()}
<div class="bar"><label>Sort by<select id="sort">${Object.entries(SORTS).map(([k,[l]])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select></label><label>Direction<select id="dir"><option value="-1" ${S.dir<0?'selected':''}>High → low / latest first</option><option value="1" ${S.dir>0?'selected':''}>Low → high / earliest first</option></select></label></div>${orderTable(L,S.page,'ex')}`}
function entity(type){const [lab,col]=type==='supplier'?['Supplier','supplier_name']:['Project site','project_site'];const g={};ev.forEach(x=>(g[x.o[col]]=g[x.o[col]]||[]).push(x));
 const sm=Object.entries(g).map(([n,l])=>({n,l,k:E.kpis(l)})).sort((a,b)=>b.k.overdue-a.k.overdue);const sel=S.ent[type],top=sm[0];
 const cur=sel&&g[sel];
 return `<h2>${type==='supplier'?'Suppliers':'Project Sites'}</h2><p class="sub">Descriptive summaries of this dataset only. Highest overdue-open-order count: <b>${esc(top.n)}</b> (${top.k.overdue}). Click a row to see its orders.</p>
 <div class="tw"><table style="min-width:860px"><thead><tr><th>${lab}</th>${['Total orders','Open','Overdue open','Doc. exceptions','High/critical','Total order value'].map(h=>`<th class="n">${h}</th>`).join('')}</tr></thead><tbody>${sm.map(({n,k})=>`<tr tabindex="0" data-e="${type}|${esc(n)}" style="${sel===n?'background:var(--acs)':''}"><td><b>${esc(n)}</b></td><td class="n">${k.total}</td><td class="n">${k.open}</td><td class="n">${k.overdue}</td><td class="n">${k.docExc}</td><td class="n">${k.highCrit}</td><td class="n">${inr(k.value)}</td></tr>`).join('')}</tbody></table></div>
 ${cur?`<h3 style="margin:18px 0 8px">Orders for ${esc(sel)}</h3>${orderTable(cur,S.page,'en')}`:'<p class="sub" style="margin-top:12px">Select a row to view the underlying orders.</p>'}`}
function method(){const v=E.validate(rows,S.asOf);const fd=rows.filter(r=>r.order_status==='Delivered'&&r.actual_delivery_date>S.asOf);
 return `<h2>Data &amp; Methodology</h2><p class="sub">Independent portfolio prototype using simulated data. Not an official ArisInfra product, not connected to ArisInfra systems, and not endorsed by any company. Rule-based, with no AI or machine learning.</p>
 <div class="card"><h3>As-of date</h3><p>All overdue calculations use this date. Default is today; change it to reproduce results.</p><input type="date" id="asof" value="${S.asOf}"></div>
 <div class="card" style="margin-top:12px"><h3>Data validation (${rows.length} records)</h3><ul class="meth" style="list-style:none;padding:0">${v.map(c=>`<li class="${c.pass?'ok':'bad'}">${c.pass?'✔':'✖'} <b>${c.name}</b> <span style="color:var(--mu)">${esc(c.detail)}</span></li>`).join('')}</ul>${fd.length?`<p><b>${fd.length} delivered orders have an actual delivery date after the as-of date</b> (e.g. ${fd.slice(0,5).map(r=>r.order_id).join(', ')}). Source values are left unchanged; these orders are flagged in their detail view.</p>`:''}</div>
 <div class="card meth" style="margin-top:12px"><h3>Business rules</h3><ul><li><b>Open</b> = status In Transit or Processing. Delivered and Cancelled are not open.</li><li><b>Overdue</b> = open and promised date earlier than the as-of date. Cancelled orders are never overdue.</li><li><b>Delivered lateness</b> = actual − promised date. A missing actual date is shown as unknown, never 0. This is history, not an active exception.</li><li><b>Documentation exception</b> = document status not Complete (non-cancelled). <b>Payment exception</b> = payment status On Hold (non-cancelled).</li><li><b>Priority and risk score</b> are source-provided illustrative values, shown as-is. This app does not recompute them and they are not a validated or predictive model. The source has Critical, Medium and Low only. High/critical share counts Critical (and High, if present).</li><li><b>Suggested actions</b>: critical overdue → escalate to supplier and site manager; other overdue → confirm revised ETA; documents → request and verify; payment hold → refer to finance. Most urgent first; all shown in order details.</li><li><b>Differences from the source file</b>: the source <code>exception_type</code> also labels 127 late-delivered orders as “Overdue delivery” and labels cancelled orders. This app follows the rules above, so its counts differ on purpose.</li></ul></div>
 <div class="card meth" style="margin-top:12px"><h3>KPI definitions</h3><ul><li><b>Overdue-order rate</b> = overdue open ÷ open × 100.</li><li><b>Documentation exception rate</b> = non-cancelled orders with a document exception ÷ all orders × 100.</li><li><b>High-risk order share</b> = high/critical non-cancelled ÷ non-cancelled × 100.</li><li><b>Open order value</b> = sum of order_value_inr for open orders.</li><li>Zero denominators show “n/a”. Each order is counted once per KPI.</li></ul></div>`}
const VIEWS={overview,exceptions,suppliers:()=>entity('supplier'),sites:()=>entity('site'),method};
const NAV=[['overview','Overview'],['exceptions','Exception Management'],['suppliers','Suppliers'],['sites','Project Sites'],['method','Data & Methodology']];
function drawer(){const d=$('#dr'),x=ev.find(x=>x.o.order_id===S.sel);if(!x){d.hidden=true;return}const{o,e}=x;d.hidden=false;
 d.innerHTML=`<button class="b" id="close" style="float:right">Close ✕</button><h2>${o.order_id}</h2><p class="sub">${esc(o.material_name)} · ${esc(o.supplier_name)}</p>${pb(o.priority)} <span class="pb" style="color:var(--mu)">Risk score ${o.risk_score}</span>
 <h4>Why this order was flagged</h4>${e.reasons.length?e.reasons.map(r=>`<div class="why"><b>${r.type}:</b> ${esc(r.text)}</div>`).join(''):'<p>No active exception under the rules in Data &amp; Methodology.</p>'}${e.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}
 <h4>Suggested next steps <span style="font-weight:400;color:var(--mu)">(suggestions only, not actions taken)</span></h4>${e.actions.map((a,i)=>`<div class="sg">${i+1}. ${esc(a)}</div>`).join('')}
 <h4>Order information</h4><dl>${[['Supplier',o.supplier_name],['Project site',o.project_site],['Category',o.material_category],['Material',o.material_name],['Quantity',N(o.quantity)+' '+o.unit_of_measure],['Unit price',inr(o.unit_price_inr)],['Order value',inr(o.order_value_inr)],['Order date',o.order_date],['Promised delivery',o.promised_delivery_date],['Actual delivery',o.actual_delivery_date||'Not recorded'],['Order status',o.order_status],['Document status',o.document_status],['Payment status',o.payment_status]].map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>
 <h4>Source dataset values (unchanged)</h4><dl><dt>days_late</dt><dd>${o.days_late}</dd><dt>exception_type</dt><dd>${esc(o.exception_type)}</dd><dt>recommended_action</dt><dd>${esc(o.recommended_action)}</dd><dt>data_type</dt><dd>${esc(o.data_type)}</dd></dl>`;$('#close').focus()}
function render(){const fe=document.activeElement,id=fe&&fe.id,pos=fe&&fe.selectionStart;
 document.querySelector('nav').innerHTML=`<h1>📦 SupplyChain Copilot</h1><small>Portfolio prototype · simulated data</small>`+NAV.map(([k,l])=>`<button data-v="${k}" ${S.view===k?'aria-current="page"':''}>${l}</button>`).join('');
 $('#main').innerHTML=rows.length?VIEWS[S.view]():'<div class="card empty">The dataset could not be loaded.</div>';drawer();
 if(id==='q'){const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-set],[data-o],[data-e],[data-pg],#reset,#close');if(!t)return;
 if(t.dataset.v){S.view=t.dataset.v;S.page=0;S.sel=null}
 else if(t.dataset.set){const s=JSON.parse(t.dataset.set);const same=Object.keys(s).every(k=>S.f[k]===s[k]);Object.keys(s).forEach(k=>S.f[k]=same?'':s[k])}
 else if(t.dataset.o)S.sel=t.dataset.o;else if(t.dataset.e){const[a,b]=t.dataset.e.split('|');S.ent[a]=S.ent[a]===b?null:b;S.page=0}
 else if(t.dataset.pg){S.page=+t.dataset.pg.split(':')[1]}
 else if(t.id==='reset'){S.f={...EF};S.page=0}else if(t.id==='close')S.sel=null;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;render()}if(e.key==='Enter'&&e.target.matches('tr[data-o],tr[data-e]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;S.page=0;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){S.f[t.dataset.f]=t.value;S.page=0}else if(t.id==='sort')S.sort=t.value;else if(t.id==='dir')S.dir=+t.value;else if(t.id==='asof'){if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value))return;S.asOf=t.value;recompute()}else return;render()});
recompute();render();
</script></body></html>
